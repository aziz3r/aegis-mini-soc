<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Cycle de vie d'un flux : les quatre façons d'être exporté"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9098"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/></marker></defs><rect width="900" height="400" rx="12" fill="#ffffff"/><rect x="34" y="150" width="158" height="54" rx="8" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.4"/><text x="113.0" y="173.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0e7490" text-anchor="middle">Premier paquet</text><text x="113.0" y="189.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">le flux est ouvert</text><path d="M 196 177 L 236 177" fill="none" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrowA)"/><rect x="240" y="60" width="230" height="234" rx="10" fill="#f7f8fa" stroke="#d8dce2" stroke-width="1.5"/><text x="355" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600" fill="#0e7490" text-anchor="middle">Flux actif</text><text x="355" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">les paquets s'accumulent</text><text x="260" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#4b5563">·  compteurs par sens</text><text x="260" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#4b5563">·  tailles et intervalles</text><text x="260" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#4b5563">·  drapeaux TCP</text><text x="260" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#4b5563">·  entropie de charge utile</text><text x="355" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">l'horloge est celle des paquets</text><text x="355" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">jamais celle du mur</text><path d="M 474 177 C 510 177, 516 72, 552 72" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="556" y="46" width="326" height="52" rx="8" fill="#ffffff" stroke="#d8dce2" stroke-width="1.4"/><text x="719.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#15171c" text-anchor="middle">Fin de connexion  —  immédiat</text><text x="719.0" y="84.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">RST, ou FIN des deux côtés</text><path d="M 474 177 C 510 177, 516 142, 552 142" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="556" y="116" width="326" height="52" rx="8" fill="#ffffff" stroke="#d8dce2" stroke-width="1.4"/><text x="719.0" y="138.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#15171c" text-anchor="middle">SYN sans réponse  —  3 s</text><text x="719.0" y="154.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">rien d'autre n'arrivera jamais</text><path d="M 474 177 C 510 177, 516 212, 552 212" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="556" y="186" width="326" height="52" rx="8" fill="#ffffff" stroke="#d8dce2" stroke-width="1.4"/><text x="719.0" y="208.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#15171c" text-anchor="middle">Inactivité  —  15 s</text><text x="719.0" y="224.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">plus aucun paquet</text><path d="M 474 177 C 510 177, 516 282, 552 282" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="556" y="256" width="326" height="52" rx="8" fill="#ffffff" stroke="#d8dce2" stroke-width="1.4"/><text x="719.0" y="278.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#15171c" text-anchor="middle">Flux trop long  —  120 s</text><text x="719.0" y="294.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">exporté par tranches</text><text x="18" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">L'export après 3 s d'une tentative de connexion sans réponse n'est pas un détail : un SYN resté sans réponse est déjà une</text><text x="18" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">observation complète. Attendre le délai d'inactivité complet ajoutait 15 secondes à la détection de chaque balayage et de</text><text x="18" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">chaque inondation — les deux attaques composées presque entièrement de SYN sans réponse. Latence médiane : de 16 s à 3 s.</text></svg>