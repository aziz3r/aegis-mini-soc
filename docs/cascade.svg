ke-width="1.4"/><text x="316.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0a7a3d" text-anchor="middle">Pas d'alerte</text><text x="316.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">le score alimente la référence</text><text x="420" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098" text-anchor="middle">oui</text><path d="M 408 218 L 452 218" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><polygon points="548,172.0 640.0,218 548,264.0 456.0,218" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.4"/><text x="548" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#15171c" text-anchor="middle">score ≥ 0,9975 ?</text><text x="548" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098" text-anchor="middle">oui</text><path d="M 548 172 L 548 124" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowR)"/><rect x="430" y="62" width="240" height="58" rx="8" fill="#fdecea" stroke="#f0b4ae" stroke-width="1.4"/><text x="550.0" y="79.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c0392b" text-anchor="middle">ALERTE</text><text x="550.0" y="95.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">une anomalie forte alerte toujours,</text><text x="550.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">même sur une attaque inconnue</text><text x="652" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098" text-anchor="middle">non</text><path d="M 640 218 L 684 218" fill="none" stroke="#8b9098" stroke-width="1.6" marker-end="url(#arrow)"/><polygon points="786,166.0 884.0,218 786,270.0 688.0,218" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.4"/><text x="786" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#15171c" text-anchor="middle">étage B dit BÉNIN</text><text x="786" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#15171c" text-anchor="middle">avec ≥ 90 % de</text><text x="786" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#15171c" text-anchor="middle">confiance ?</text><text x="786" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098" text-anchor="middle">oui</text><path d="M 786 272 L 786 334" fill="none" stroke="#0a7a3d" stroke-width="1.6" marker-end="url(#arrowV)"/><rect x="668" y="338" width="232" height="48" rx="8" fill="#eef7f1" stroke="#a8d5bc" stroke-width="1.4"/><text x="784.0" y="358.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0a7a3d" text-anchor="middle">Alerte supprimée</text><text x="784.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098" text-anchor="middle">341 faux positifs/heure ramenés à 53</text><text x="762" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098" text-anchor="middle">non</text><path d="M 786 166 L 786 112 L 678 112" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrowR)"/><text x="18" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">L'étage A est réglé pour la sensibilité, ce qui coûte des faux positifs dans la bande juste au-dessus du seuil. Quand le</text><text x="18" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">classifieur supervisé reconnaît ce trafic comme normal — et le dit avec assurance — l'alerte est supprimée. Jamais au-delà de</text><text x="18" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#8b9098">0,9975 : c'est cette borne qui préserve la détection des attaques que le classifieur n'a jamais apprises.</text></svg>