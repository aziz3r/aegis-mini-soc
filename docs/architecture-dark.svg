<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-label="Chaîne de détection AEGIS : des paquets aux incidents"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker></defs><rect width="940" height="600" rx="12" fill="#0d1117"/><rect x="18" y="96" width="178" height="212" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="107" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle">Sources de trafic</text><rect x="32" y="140" width="150" height="24" rx="6" fill="#11161d" stroke="#30363d" stroke-width="1"/><text x="42" y="156.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Laboratoire</text><text x="107" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10" fill="#7d8590" text-anchor="middle">vérité terrain connue</text><rect x="32" y="196" width="150" height="24" rx="6" fill="#11161d" stroke="#30363d" stroke-width="1"/><text x="42" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Rejeu de PCAP</text><text x="107" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10" fill="#7d8590" text-anchor="middle">99 000 paquets/s</text><rect x="32" y="252" width="150" height="24" rx="6" fill="#11161d" stroke="#30363d" stroke-width="1"/><text x="42" y="268.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">Capture réelle</text><text x="107" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10" fill="#7d8590" text-anchor="middle">scapy, root requis</text><path d="M 200 202 L 242 202" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowA)"/><rect x="246" y="34" width="300" height="420" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="396" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#22d3ee" text-anchor="middle">Moteur de détection</text><rect x="262" y="76" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="96.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Assemblage en flux</text><text x="396.0" y="112.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">5-uplet bidirectionnel · tas d'échéances</text><path d="M 396 124 L 396 138" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="262" y="138" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="158.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">52 features</text><text x="396.0" y="174.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">33 flux · 15 hôte source · 4 hôte cible</text><path d="M 396 186 L 396 200" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="262" y="200" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Étage A — IsolationForest</text><text x="396.0" y="236.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">trafic bénin seul · score calibré FRE</text><path d="M 396 248 L 396 262" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="262" y="262" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="282.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Seuil adaptatif</text><text x="396.0" y="298.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">quantile par hôte, sur un plancher global</text><path d="M 396 310 L 396 324" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="262" y="324" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Étage B — HistGradientBoosting</text><text x="396.0" y="360.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">nomme la famille et oppose un veto</text><path d="M 396 372 L 396 386" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="262" y="386" width="268" height="48" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="396.0" y="406.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Attribution par occlusion</text><text x="396.0" y="422.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">pourquoi cette alerte</text><path d="M 550 234 L 592 234" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowA)"/><rect x="596" y="96" width="326" height="212" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="759" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#22d3ee" text-anchor="middle">Couche SOC</text><rect x="612" y="140" width="294" height="50" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="759.0" y="161.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Corrélation en incidents</text><text x="759.0" y="177.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">regroupées selon la forme de l'attaque</text><rect x="612" y="200" width="294" height="50" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="759.0" y="221.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">MITRE ATT&amp;CK · criticité des actifs</text><text x="759.0" y="237.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">gravité = marge x valeur de l'actif</text><rect x="612" y="260" width="294" height="34" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="759.0" y="281.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">SQLite (WAL) ou PostgreSQL</text><path d="M 759 312 L 759 344" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="612" y="348" width="294" height="50" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="759.0" y="369.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">API FastAPI</text><text x="759.0" y="385.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">REST + WebSocket · JWT · 3 rôles · audit</text><path d="M 759 402 L 759 428" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="612" y="432" width="294" height="50" rx="8" fill="#11161d" stroke="#30363d" stroke-width="1.4"/><text x="759.0" y="453.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Interface React + TypeScript</text><text x="759.0" y="469.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">8 écrans · temps réel</text><text x="18" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">Les trois sources traversent exactement la même chaîne : rien du chemin de détection n'est simulé. L'horloge est celle des</text><text x="18" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">paquets, jamais celle du mur — c'est ce qui garantit qu'un PCAP rejoué à x60 produit les mêmes flux que la capture d'origine.</text><text x="18" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">L'étage A n'a jamais vu d'attaque : il peut donc en signaler une qu'il ne connaît pas. L'étage B ne décide pas s'il faut alerter,</text><text x="18" y="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">il nomme ce que l'anomalie ressemble — et supprime les fausses alertes qu'il reconnaît comme du trafic normal.</text></svg>