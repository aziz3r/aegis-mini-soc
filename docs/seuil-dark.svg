<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Le seuil adaptatif : pourquoi un quantile et pas un MAD"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/></marker><marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/></marker></defs><rect width="900" height="430" rx="12" fill="#0d1117"/><rect x="282" y="30" width="336" height="54" rx="8" fill="#0b2b33" stroke="#22d3ee" stroke-width="1.4"/><text x="450.0" y="53.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#22d3ee" text-anchor="middle">Le score de l'étage A est un percentile</text><text x="450.0" y="69.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">du trafic bénin : donc quasi uniforme sur [0, 1]</text><text x="450" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#7d8590" text-anchor="middle">médiane ≈ 0,52   ·   MAD ≈ 0,24</text><path d="M 330 116 L 250 148" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#arrowR)"/><path d="M 570 116 L 650 148" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrowV)"/><rect x="18" y="152" width="414" height="196" rx="10" fill="#2a1416" stroke="#6e2b28" stroke-width="1.5"/><text x="225" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f85149" text-anchor="middle">La règle classique</text><text x="225" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3" text-anchor="middle">médiane + 4 × 1,4826 × MAD ≈ 1,94</text><text x="225" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f85149" text-anchor="middle">plafonné pour TOUS les hôtes</text><rect x="70" y="262" width="310" height="40" rx="8" fill="#11161d" stroke="#6e2b28" stroke-width="1.4"/><text x="225.0" y="286.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f85149" text-anchor="middle">rappel tombé à 14 %</text><text x="225" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">Le MAD suppose un cœur serré et de rares valeurs extrêmes.</text><rect x="468" y="152" width="414" height="196" rx="10" fill="#122118" stroke="#2d5a3d" stroke-width="1.5"/><text x="675" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">La statistique adaptée</text><text x="675" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e6edf3" text-anchor="middle">max(plancher, quantile(scores, 0,99))</text><text x="675" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="middle">se lit comme un budget de faux positifs</text><rect x="520" y="262" width="310" height="40" rx="8" fill="#11161d" stroke="#2d5a3d" stroke-width="1.4"/><text x="675.0" y="286.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="middle">rappel 99,6 %</text><text x="675" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#7d8590" text-anchor="middle">Une loi uniforme n'a ni cœur serré ni valeurs extrêmes rares.</text><text x="18" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">Garde-fou : seuls les scores qui n'ont PAS alerté alimentent la référence. Sans cela, un hôte sous attaque prolongée</text><text x="18" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">normaliserait son propre trafic d'attaque et se tairait — c'est ainsi qu'un attaquant patient bat une adaptation naïve.</text><text x="18" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">Un plafond limite aussi jusqu'où un hôte peut relever sa barre.</text></svg>